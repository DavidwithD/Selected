<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Selected</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Selected</h1>
        <span id="count" class="count">0 saved</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="recording" />
        <span>Recording</span>
      </label>
    </header>

    <section class="filters">
      <input
        type="search"
        id="q"
        placeholder="Search text  ( / )"
        autocomplete="off"
      />
      <select id="host">
        <option value="">All sites</option>
      </select>
      <label class="date">From <input type="date" id="from" /></label>
      <label class="date">To <input type="date" id="to" /></label>
      <select id="order">
        <option value="desc">Newest first</option>
        <option value="asc">Oldest first</option>
      </select>
      <button id="reset" class="ghost">Reset</button>
    </section>

    <section class="bar">
      <label class="check">
        <input type="checkbox" id="selectPage" />
        <span id="selectedCount">Select page</span>
      </label>
      <div class="spacer"></div>
      <button id="copySel" disabled>Copy</button>
      <button id="delSel" class="danger" disabled>Delete</button>
      <span class="divider"></span>
      <span class="label">Download matches</span>
      <button data-download="json">JSON</button>
      <button data-download="csv">CSV</button>
      <button data-download="txt">TXT</button>
      <!-- Closed by default. The summary states the current choice, so pressing a
           download button is never a guess about what the file will hold. -->
      <details class="fields">
        <summary id="fieldsSummary">carrying all 6 fields</summary>
        <div class="fields-panel">
          <label class="check"
            ><input type="checkbox" data-field="text" checked />text</label
          >
          <label class="check"
            ><input type="checkbox" data-field="url" checked />url</label
          >
          <label class="check"
            ><input type="checkbox" data-field="title" checked />title</label
          >
          <label class="check"
            ><input type="checkbox" data-field="host" checked />host</label
          >
          <label class="check"
            ><input type="checkbox" data-field="source" checked />source</label
          >
          <label class="check"
            ><input type="checkbox" data-field="savedAt" checked />date</label
          >
        </div>
      </details>
      <span class="divider"></span>
      <button id="clearAll" class="danger ghost">Clear all</button>
    </section>

    <details id="settings" class="settings">
      <summary>Settings</summary>
      <div class="settings-grid">
        <!-- An empty box means forever, and the placeholder is what says so.
             The word "days" hides then, so the line reads as a sentence either
             way. 0 is still what gets stored. The value applies on Enter or
             when the box loses focus. -->
        <label>
          Keep selections for
          <input
            type="number"
            id="retention"
            min="0"
            max="3650"
            step="1"
            placeholder="forever"
          />
          <span id="retentionDays">days</span>
        </label>
        <!-- Only listed sites save anything. A box or a ✕ takes effect on
             click. The toolbar popup writes the same list. -->
        <div class="sites">
          <table>
            <thead>
              <tr>
                <th>Site</th>
                <th>Save on select</th>
                <th>Save on shortcut</th>
                <th><span class="sr">Remove</span></th>
              </tr>
            </thead>
            <tbody id="siteRows"></tbody>
          </table>
          <p id="noSites" class="note" hidden>
            No sites yet. Click the toolbar icon on a page to add it.
          </p>
          <form id="addSite" class="add-site">
            <input
              type="text"
              id="newSite"
              placeholder="paste a site or URL"
              aria-label="Site to add"
              autocomplete="off"
            />
            <button type="submit">Add</button>
          </form>
          <p id="shortcutLine" class="note"></p>
        </div>
      </div>
    </details>

    <main>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>
    </main>

    <footer class="pager">
      <button id="prev">Previous</button>
      <span id="pageInfo">—</span>
      <button id="next">Next</button>
      <select id="pageSize">
        <option value="25">25 per page</option>
        <option value="50" selected>50 per page</option>
        <option value="100">100 per page</option>
      </select>
    </footer>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="page.js"></script>
  </body>
</html>
